services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siapukom
    ports:
      - '5432:5432'
    volumes:
      - siapukom_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/siapukom?schema=public
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-ganti-dengan-secret-acak-minimal-32-karakter}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      NODE_ENV: production
    ports:
      - '4000:4000'

volumes:
  siapukom_db_data:
